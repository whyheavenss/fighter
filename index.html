<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ПВО Симулятор 2026: Защита Заводов</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05020c; }
        #vr-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 35px; background: #00ff66; color: black; border: 3px solid #fff;
            border-radius: 8px; font-family: monospace; font-size: 22px; font-weight: bold; cursor: pointer; z-index: 999;
            box-shadow: 0 0 25px #00ff66;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="vr-button">ЗАПУСТИТЬ ПЕРЕХВАТЧИК</button>

    <script>
        let scene, camera, renderer;
        let jet, joystickBase, joystick;
        let speed = 0, isAirborne = false;
        let shaheds = [], bullets = [], targets = [];
        let score = 0, factoryHealth = 100;
        
        let controllerRight;
        let isHoldingJoystick = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x140e28); // Мрачное предрассветное небо ПВО
            scene.fog = new THREE.FogExp2(0x140e28, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Кнопка VR
            const vrBtn = document.getElementById('vr-button');
            vrBtn.addEventListener('click', () => {
                navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then((session) => {
                    renderer.xr.setSession(session);
                    vrBtn.style.display = 'none';
                });
            });

            // Освещение
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const light = new THREE.DirectionalLight(0xffddaa, 1.0);
            light.position.set(100, 200, 50);
            scene.add(light);

            // Земля (Ландшафт)
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(6000, 6000, 8, 8),
                new THREE.MeshLambertMaterial({ color: 0x1e251c, wireframe: false })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // 🏭 СОЗДАЕМ ИНДУСТРИАЛЬНЫЕ ОБЪЕКТЫ (ЗАВОДЫ И СТАНЦИИ)
            for (let i = 0; i < 5; i++) {
                let factoryGroup = new THREE.Group();
                
                // Главный цех завода
                let hangar = new THREE.Mesh(new THREE.BoxGeometry(40, 15, 60), new THREE.MeshLambertMaterial({color: 0x55555f}));
                hangar.position.y = 7.5;
                factoryGroup.add(hangar);

                // Высокая дымовая труба ТЭЦ
                let chimney = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 40), new THREE.MeshLambertMaterial({color: 0x773333}));
                chimney.position.set(15, 20, -20);
                factoryGroup.add(chimney);

                // Огонек на трубе
                let redLight = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color: 0xff0000}));
                redLight.position.set(15, 40, -20);
                factoryGroup.add(redLight);

                // Расставляем заводы вдоль курса полета
                factoryGroup.position.set((i - 2) * 180, 0, -600 - (Math.random() * 300));
                scene.add(factoryGroup);
                targets.push(factoryGroup); // Шахеды будут лететь сюда
            }

            // ВЗЛЕТНАЯ ПОЛОСА ПВО
            runway = new THREE.Mesh(new THREE.BoxGeometry(30, 0.2, 1000), new THREE.MeshLambertMaterial({ color: 0x282828 }));
            runway.position.set(0, 0.1, -450);
            scene.add(runway);

            // ИСТРЕБИТЕЛЬ С КАБИНОЙ
            jet = new THREE.Group();
            jet.position.set(0, 0, 0); // Старт на ВПП
            scene.add(jet);

            // Каркас кабины (Стекло)
            const glass = new THREE.Mesh(
                new THREE.SphereGeometry(2.5, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x33ff33, wireframe: true, opacity: 0.03, transparent: true })
            );
            jet.add(glass);

            // Авиационная панель приборов
            const panel = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 0.5), new THREE.MeshLambertMaterial({color: 0x1c1d22}));
            panel.position.set(0, -0.3, -0.8);
            jet.add(panel);

            // 🕹 ИСПРАВЛЕННЫЙ ШТУРВАЛ (РУС) — СТАЛ ВЫШЕ И УДОБНЕЕ
            joystickBase = new THREE.Group();
            joystickBase.position.set(0, 0.05, -0.5); // Подняли в зону прямой видимости груди пилота
            jet.add(joystickBase);

            const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.5), new THREE.MeshLambertMaterial({ color: 0x333339 }));
            stick.position.y = 0.25;
            joystickBase.add(stick);

            joystick = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshLambertMaterial({ color: 0xcc0000 }));
            joystick.position.y = 0.5;
            joystickBase.add(joystick);

            // Камера пилота
            jet.add(camera);
            camera.position.set(0, 0.6, 0);

            // 🎮 КВЕСТ 3: НАСТРОЙКА КОНТРОЛЛЕРОВ
            controllerRight = renderer.xr.getController(0);
            
            // МАГНИТНЫЙ ЗАХВАТ: Жмем Grip — штурвал автоматически в руке!
            controllerRight.addEventListener('gripdown', () => {
                isHoldingJoystick = true;
            });
            controllerRight.addEventListener('gripup', () => {
                isHoldingJoystick = false;
                joystickBase.rotation.set(0, 0, 0);
            });

            // СТРЕЛЬБА НА КУРОК (TRIGGER) НА ПРАВОМ КОНТРОЛЛЕРЕ
            controllerRight.addEventListener('triggerdown', () => {
                if (isHoldingJoystick) fireGuns();
            });

            scene.add(controllerRight);

            // Маркер руки в VR
            let hand = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0x00ff66}));
            controllerRight.add(hand);

            // Спавн реалистичных Шахедов
            for (let i = 0; i < 6; i++) { spawnShahed(); }

            renderer.setAnimationLoop(gameLoop);
        }

        // РЕАЛИСТИЧНАЯ МОДЕЛЬ ШАХЕДА-136 (Кили на крыльях + геометрия камикадзе)
        function spawnShahed() {
            const shahed = new THREE.Group();
            
            // Большое треугольное дельтовидное крыло
            const wing = new THREE.Mesh(new THREE.ConeGeometry(5, 0.15, 3), new THREE.MeshLambertMaterial({ color: 0x3a3d40 }));
            wing.rotation.x = Math.PI / 2;
            shahed.add(wing);

            // Длинный цилиндрический фюзеляж спереди
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3), new THREE.MeshLambertMaterial({ color: 0x25282a }));
            body.rotation.x = Math.PI / 2;
            body.position.z = -0.5;
            shahed.add(body);

            // Реалистичные вертикальные кили (стабилизаторы) на законцовках крыльев
            const stabilizerL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.8, 0.6), new THREE.MeshLambertMaterial({color: 0x25282a}));
            stabilizerL.position.set(-2.5, 0.3, 0.5);
            shahed.add(stabilizerL);

            const stabilizerR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.8, 0.6), new THREE.MeshLambertMaterial({color: 0x25282a}));
            stabilizerR.position.set(2.5, 0.3, 0.5);
            shahed.add(stabilizerR);

            // Шахеды появляются высоко в небе и выбирают случайный завод в качестве цели
            let randomFactory = targets[Math.floor(Math.random() * targets.length)];
            shahed.position.set(
                randomFactory.position.x + (Math.random() * 100 - 50),
                180 + Math.random() * 70,
                jet.position.z - 1200 - Math.random() * 400
            );

            // Запоминаем точку завода, куда летит дрон
            shahed.userData = { targetFactory: randomFactory, targetX: randomFactory.position.x, targetZ: randomFactory.position.z };

            scene.add(shahed);
            shaheds.push(shahed);
        }

        function fireGuns() {
            // Реалистичные скорострельные сдвоенные авиапушки
            const makeLaser = (x) => {
                const b = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 8), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
                b.rotation.x = Math.PI / 2;
                b.position.set(jet.position.x + x, jet.position.y - 0.3, jet.position.z - 4);
                scene.add(b);
                bullets.push(b);
            };
            makeLaser(-1.8); makeLaser(1.8);
        }

        function gameLoop() {
            // Постоянный автоматический разгон по полосе
            if (speed < 1.4) speed += 0.008;

            // УПРАВЛЕНИЕ: ЕСЛИ GRIP ЗАЖАТ — РЫЧАГ РАБОТАЕТ
            if (controllerRight && isHoldingJoystick) {
                let handRot = controllerRight.rotation;

                // Джойстик синхронно повторяет наклон руки
                joystickBase.rotation.set(handRot.x, 0, handRot.z);

                if (speed > 0.4) {
                    jet.rotation.y -= handRot.z * 0.016; // Поворот
                    jet.rotation.z = -handRot.z * 1.5;   // РЕАЛИСТИЧНЫЙ КРЕН НА КРЫЛО ПРИ ВИРАЖЕ
                    
                    if (handRot.x < -0.05 || isAirborne) {
                        jet.rotation.x = -handRot.x * 0.45; // Тангаж (взлет/пикирование)
                        isAirborne = true;
                    }
                }
            } else {
                // Если штурвал отпущен — самолет стабилизирует крен самостоятельно
                jet.rotation.z *= 0.94;
                if(isAirborne) jet.rotation.x *= 0.98;
            }

            // Физика шасси и полета
            if (isAirborne) {
                jet.translateZ(-speed);
            } else {
                jet.position.z -= speed;
                jet.position.y = 0.2;
                jet.rotation.x = 0;
            }

            if (jet.position.y < 0.2) { jet.position.y = 0.2; isAirborne = false; }

            // Полет снарядов пушки
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].position.z -= 6;
                
                for (let j = shaheds.length - 1; j >= 0; j--) {
                    if (bullets[i].position.distanceTo(shaheds[j].position) < 25) {
                        // Попадание! Уничтожаем Шахед
                        scene.remove(shaheds[j]);
                        shaheds.splice(j, 1);
                        scene.remove(bullets[i]);
                        bullets.splice(i, 1);
                        score++;
                        spawnShahed(); // Спавним новую волну
                        break;
                    }
                }

                if (bullets[i] && bullets[i].position.z < jet.position.z - 700) {
                    scene.remove(bullets[i]);
                    bullets.splice(i, 1);
                }
            }

            // ЛОГИКА ШАХЕДОВ: ОНИ АТАКУЮТ ЗАВОДЫ
            shaheds.forEach((shahed, index) => {
                let data = shahed.userData;
                
                // Направление полета строго на выбранный завод
                shahed.position.z += 0.6; // Скорость дрона
                if (shahed.position.x < data.targetX) shahed.position.x += 0.15;
                if (shahed.position.x > data.targetX) shahed.position.x -= 0.15;
                
                // Траектория пикирования (снижаются к заводу по мере приближения)
                if (shahed.position.z > data.targetZ - 300 && shahed.position.y > 10) {
                    shahed.position.y -= 0.4;
                    shahed.rotation.x = 0.2; // Наклоняем нос вниз к цели
                }

                // ПРОВЕРКА УДАРА ПО ЗАВОДУ: если долетел до координат цели
                if (shahed.position.z >= data.targetZ && Math.abs(shahed.position.x - data.targetX) < 30) {
                    // Произошел взрыв на заводе!
                    scene.remove(shahed);
                    shaheds.splice(index, 1);
                    spawnShahed(); // Летит следующий
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
