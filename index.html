<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Кибер-Истребитель 2026</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      /* Кнопка для раскрытия на весь экран */
      #fullscreen-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 9999;
        padding: 12px 24px;
        background: #00ffca;
        color: #000;
        border: none;
        border-radius: 8px;
        font-family: sans-serif;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 15px #00ffca;
      }
      #fullscreen-btn:hover { background: #fff; }
    </style>
  </head>
  <body>

    <button id="fullscreen-btn" onclick="goFullscreen()">ИГРАТЬ НА ВЕСЬ ЭКРАН</button>

    <script>
      let score = 0;
      let speed = 0.5; 
      let enemies = [];

      function goFullscreen() {
        let elem = document.documentElement;
        if (elem.requestFullscreen) { elem.requestFullscreen(); }
        document.getElementById('fullscreen-btn').style.display = 'none';
      }

      // Главная логика
      AFRAME.registerComponent('flight-control', {
        init: function () {
          this.player = document.querySelector('#jet');
          this.camera = document.querySelector('#cam');
          this.joystick = document.querySelector('#jstick');
          this.hand = document.querySelector('#pilot-hand');
          this.scoreText = document.querySelector('#score-txt');

          // Стрельба на клик или триггер
          window.addEventListener('click', () => { this.shoot(); });
          window.addEventListener('triggerdown', () => { this.shoot(); });

          // Создаем 5 врагов сразу внутри кода (без внешних ссылок!)
          for (let i = 0; i < 5; i++) { this.spawnEnemy(i); }
        },

        tick: function (time, timeDelta) {
          let pos = this.player.getAttribute('position');
          pos.z -= speed;
          this.player.setAttribute('position', pos);

          // Управление наклоном от взгляда
          let camRot = this.camera.getAttribute('rotation');
          let jetRot = this.player.getAttribute('rotation');

          jetRot.z = -camRot.y * 2; 
          jetRot.x = camRot.x;
          jetRot.y = camRot.y;
          this.player.setAttribute('rotation', jetRot);

          // Двигаем джойстик и руку в кабине
          this.joystick.setAttribute('rotation', {x: -camRot.x, y: 0, z: -camRot.y * 2});
          this.hand.setAttribute('position', {
            x: 0.2 + (-camRot.y * 0.005),
            y: -0.4 + (camRot.x * 0.003),
            z: -0.4
          });

          // Движение врагов навстречу
          enemies.forEach(enemy => {
            let ePos = enemy.getAttribute('position');
            if (ePos.z > pos.z + 10) {
              ePos.z = pos.z - 100;
              ePos.x = (Math.random() * 80) - 40;
              ePos.y = (Math.random() * 30) + 5;
              enemy.setAttribute('position', ePos);
              enemy.setAttribute('visible', true);
              enemy.classList.add('target');
            }
          });
        },

        shoot: function () {
          let pPos = this.player.getAttribute('position');
          let pRot = this.player.getAttribute('rotation');

          // Создаем два лазерных луча
          const makeLaser = (xOffset) => {
            let laser = document.createElement('a-cylinder');
            laser.setAttribute('radius', 0.05);
            laser.setAttribute('height', 6);
            laser.setAttribute('material', {color: '#ff0055', shader: 'flat'});
            laser.setAttribute('position', {x: pPos.x + xOffset, y: pPos.y - 0.2, z: pPos.z - 2});
            laser.setAttribute('rotation', {x: 90, y: pRot.y, z: 0});
            laser.setAttribute('animation', {
              property: 'position',
              to: `${pPos.x + xOffset} ${pPos.y} ${pPos.z - 150}`,
              dur: 400,
              easing: 'linear'
            });
            document.querySelector('a-scene').appendChild(laser);
            setTimeout(() => { laser.remove(); }, 400);
          };

          makeLaser(-1.5); makeLaser(1.5);

          // Проверка попадания
          let ray = document.querySelector('#laser-pointer').components.raycaster;
          let hit = ray.getIntersection(document.querySelectorAll('.target'));
          
          if (hit) {
            let targetEl = hit.el;
            targetEl.setAttribute('visible', false);
            targetEl.classList.remove('target');
            score += 100;
            this.scoreText.setAttribute('value', `SCORE: ${score}`);
          }
        },

        spawnEnemy: function (i) {
          let enemy = document.createElement('a-entity');
          // Красивый футуристичный вражеский дрон из полигонов
          enemy.setAttribute('geometry', {primitive: 'cone', radiusBottom: 1.5, height: 4});
          enemy.setAttribute('material', {color: '#ff0055', metalness: 0.8, roughness: 0.2});
          enemy.setAttribute('rotation', {x: 90, y: 0, z: 0});
          
          let pPos = this.player.getAttribute('position') || {x:0, y:0, z:25};
          enemy.setAttribute('position', {
            x: (Math.random() * 60) - 30,
            y: (Math.random() * 20) + 10,
            z: pPos.z - (60 + (i * 20))
          });
          
          enemy.classList.add('target');
          document.querySelector('a-scene').appendChild(enemy);
          enemies.push(enemy);
        }
      });
    </script>

    <a-scene flight-control vr-mode-ui="enabled: true">
      
      <a-sky color="#0a051b"></a-sky>
      <a-light type="ambient" color="#fff"></a-light>

      <a-grid width="10000" height="10000" material="color: #110933; gridColor: #00ffca; opacity: 0.6" rotation="-90 0 0"></a-grid>

      <a-entity id="jet" position="0 20 0">
        
        <a-camera id="cam" look-controls wasd-controls-enabled="false" near="0.1">
          
          <a-cylinder position="0 0.2 -0.5" radius="1.2" height="1.5" rotation="90 0 0" material="color: #00ffca; opacity: 0.1; transparent: true; wireframe: false" scale="1 1 0.5"></a-cylinder>
          
          <a-box position="0 -0.5 -0.6" width="1.4" height="0.4" depth="0.5" color="#0d0d1a">
            <a-plane position="0 0.11 0.26" rotation="-20 0 0" width="0.3" height="0.15" color="#00ffca" material="opacity: 0.2"></a-plane>
          </a-box>

          <a-entity position="0 0 -1.2">
            <a-text id="score-txt" value="SCORE: 0" position="-0.4 0.4 0" color="#00ffca" width="2"></a-text>
            <a-text value="SPEED: MACH 1.5\nGEAR: UP" position="0.15 -0.3 0" color="#00ffca" width="1.2"></a-text>
            
            <a-entity id="laser-pointer" raycaster="objects: .target; far: 150">
              <a-ring radius-inner="0.05" radius-outer="0.06" color="#00ffca" material="shader: flat"></a-ring>
              <a-circle radius="0.005" color="#00ffca" material="shader: flat"></a-circle>
            </a-entity>
          </a-entity>

          <a-entity id="jstick" position="0 -0.4 -0.4">
            <a-cylinder radius="0.02" height="0.3" color="#1a1a3a" rotation="0 0 0" position="0 0.15 0"></a-cylinder>
            <a-sphere radius="0.04" color="#ff0055" position="0 0.3 0"></a-sphere>
          </a-entity>

          <a-entity id="pilot-hand" position="0.2 -0.4 -0.4">
            <a-box width="0.08" height="0.08" depth="0.3" color="#1a1a3a" rotation="15 0 0"></a-box>
            <a-sphere radius="0.05" color="#ff0055" position="0 0 0.15"></a-sphere>
          </a-entity>

        </a-camera>

        <a-box position="-2.5 -0.2 -1" width="3" height="0.05" depth="1.5" color="#0d0d1a" rotation="0 -20 5"></a-box>
        <a-box position="2.5 -0.2 -1" width="3" height="0.05" depth="1.5" color="#0d0d1a" rotation="0 20 -5"></a-box>

      </a-entity>

      <a-entity laser-controls="hand: right"></a-entity>
      <a-entity laser-controls="hand: left"></a-entity>

    </a-scene>
  </body>
</html>
