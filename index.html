<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Стальной Перехватчик 2026</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050510; font-family: monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #39ff14;
            font-size: 20px; text-shadow: 0 0 10px #00ff00; pointer-events: none;
        }
        #controls-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #00ffff; font-size: 16px; text-align: center; text-shadow: 0 0 5px #00ffff;
        }
    </style>
</head>
<body>

    <div id="ui">
        [ БОРТОВОЙ КОМПЬЮТЕР ИСТРЕБИТЕЛЯ ]<br>
        ---------------------------------<br>
        СКОРОСТЬ: <span id="speed">0</span> КМ/Ч<br>
        ВЫСОТА: <span id="alt">0</span> М<br>
        СБИТО ШАХЕДОВ: <span id="score">0</span>
    </div>

    <div id="controls-hint">
        Управление (ПК): Мышка — поворот/наклон | Клик — огонь<br>
        Управление (Quest 3): Води пальцем по экрану/стику для набора высоты и стрельбы
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ресайз под экран
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Состояние игры
        let player = { x: 0, y: 0, z: 0, pitch: 0, yaw: 0, roll: 0, speed: 0, airborne: false };
        let score = 0;
        let bullets = [];
        let shaheds = [];
        let terrainGrid = [];

        // Инициализация цветной земли (сетки)
        for (let z = 0; z < 60; z++) {
            let row = [];
            for (let x = -20; x <= 20; x++) {
                row.push({ x: x * 30, y: 0, z: -z * 40 });
            }
            terrainGrid.push(row);
        }

        // Создание врагов (Шахедов) с треугольными крыльями
        function spawnShahed() {
            return {
                x: (Math.random() * 800) - 400,
                y: (Math.random() * 200) + 100,
                z: player.z - 1500 - (Math.random() * 500),
                active: true,
                size: 25
            };
        }
        for (let i = 0; i < 7; i++) { shaheds.push(spawnShahed()); }

        // Мышка на ПК управляет самолетом
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / canvas.width) - 0.5;
            mouseY = (e.clientY / canvas.height) - 0.5;
        });

        // Стрельба
        window.addEventListener('mousedown', () => {
            bullets.push({ x: player.x - 15, y: player.y, z: player.z - 20 });
            bullets.push({ x: player.x + 15, y: player.y, z: player.z - 20 });
        });

        // Главный игровой цикл (60 FPS)
        function loop() {
            ctx.fillStyle = '#050515'; // Глубокое ночное небо
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Логика полета и разгона
            if (player.speed < 25) player.speed += 0.15; // Авто-разгон на взлетной полосе
            
            player.yaw += -mouseX * 0.05;
            player.pitch += -mouseY * 0.03;
            player.roll = mouseX * 40;

            if (player.speed > 15 && player.pitch > 0.1) {
                player.airborne = true;
            }

            player.z -= player.speed;
            if (player.airborne) {
                player.y += Math.sin(player.pitch) * player.speed;
                player.x += Math.sin(player.yaw) * player.speed;
            } else {
                player.y = 0;
                player.pitch = 0;
            }

            // Защита от падения под текстуры
            if (player.y < 0) { player.y = 0; player.airborne = false; }

            // Обновление интерфейса
            document.getElementById('speed').innerText = Math.round(player.speed * 30);
            document.getElementById('alt').innerText = Math.round(player.y * 3);
            document.getElementById('score').innerText = score;

            // 3D Камера (Матрица проекции на экран)
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            let fov = 400;

            function project(x, y, z) {
                let relX = x - player.x;
                let relY = y - player.y;
                let relZ = z - player.z;

                if (relZ >= 0) return null; // Сзади нас
                let scale = fov / -relZ;
                return {
                    x: cx + relX * scale,
                    y: cy - relY * scale,
                    scale: scale
                };
            }

            // 2. ОТРИСОВКА ВЗЛЕТНОЙ ПОЛОСЫ И ТЕКСТУРЫ ЗЕМЛИ
            ctx.strokeStyle = '#005533';
            ctx.lineWidth = 1;

            // Отрисовка сетки полей
            let offsetZ = Math.floor(player.z / 40) * 40;
            for (let z = 0; z < 40; z++) {
                ctx.beginPath();
                for (let x = -20; x <= 20; x++) {
                    let p = project(x * 50, 0, offsetZ - z * 40);
                    if (p) {
                        if (x === -20) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    }
                }
                ctx.stroke();
            }

            // Отрисовка Взлетно-Посадочной Полосы (ВПП)
            ctx.fillStyle = '#22222b';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            
            let runwayLeft1 = project(-30, 0, 0);
            let runwayRight1 = project(30, 0, 0);
            let runwayLeft2 = project(-30, 0, -800);
            let runwayRight2 = project(30, 0, -800);

            if (runwayLeft1 && runwayLeft2 && runwayRight1 && runwayRight2) {
                ctx.beginPath();
                ctx.moveTo(runwayLeft1.x, runwayLeft1.y);
                ctx.lineTo(runwayLeft2.x, runwayLeft2.y);
                ctx.lineTo(runwayRight2.x, runwayRight2.y);
                ctx.lineTo(runwayRight1.x, runwayRight1.y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // 3. ОТРИСОВКА ОХОТЫ НА ШАХЕДЫ
            shaheds.forEach((s) => {
                if (!s.active) return;
                
                // Движение Шахеда навстречу
                s.z += 3;
                if (s.z > player.z) { Object.assign(s, spawnShahed()); }

                let p = project(s.x, s.y, s.z);
                if (p) {
                    let w = s.size * p.scale;
                    
                    // Рисуем Шахед (Треугольное крыло Delta-wing)
                    ctx.fillStyle = '#111115';
                    ctx.strokeStyle = '#ff0055';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y - w/4); // Нос
                    ctx.lineTo(p.x - w, p.y + w/2); // Левое крыло
                    ctx.lineTo(p.x + w, p.y + w/2); // Правое крыло
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Сигнальный мигающий огонек на фюзеляже Шахеда
                    if (Date.now() % 400 > 200) {
                        ctx.fillStyle = '#ff0000';
                        ctx.beginPath(); ctx.arc(p.x, p.y + w/4, 3 * p.scale, 0, Math.PI*2); ctx.fill();
                    }
                }
            });

            // 4. НАШИ ЛАЗЕРНЫЕ СНАРЯДЫ
            ctx.fillStyle = '#00ffff';
            bullets.forEach((b, index) => {
                b.z -= 45; // Скорость пули
                let p = project(b.x, b.y, b.z);
                if (p) {
                    ctx.fillRect(p.x, p.y, 4, 12 * p.scale);

                    // Проверка коллизий с Шахедами
                    shaheds.forEach((s) => {
                        if (!s.active) return;
                        let dist = Math.hypot(b.x - s.x, b.y - s.y, b.z - s.z);
                        if (dist < 40) {
                            s.active = false;
                            score++;
                            bullets.splice(index, 1);
                            
                            // Анимация взрыва
                            ctx.fillStyle = '#ff5500';
                            ctx.beginPath(); ctx.arc(p.x, p.y, 30, 0, Math.PI*2); ctx.fill();
                            
                            setTimeout(() => { Object.assign(s, spawnShahed()); }, 1000);
                        }
                    });
                }
                if (b.z < player.z - 2000) bullets.splice(index, 1);
            });

            // 5. HUD АВИАЦИОННЫЙ ПРИЦЕЛ ПО ЦЕНТРУ ЭКРАНА
            ctx.strokeStyle = '#39ff14';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.moveTo(cx - 45, cy); ctx.lineTo(cx - 15, cy);
            ctx.moveTo(cx + 15, cy); ctx.lineTo(cx + 45, cy);
            ctx.moveTo(cx, cy - 45); ctx.lineTo(cx, cy - 15);
            ctx.moveTo(cx, cy + 15); ctx.lineTo(cx, cy + 45);
            ctx.stroke();

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
