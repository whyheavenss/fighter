<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Meta Quest 3: Advanced Jet Fighter</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      #vr-btn-overlay {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 15px 30px;
        background: #ff0055;
        color: #fff;
        border: 2px solid #fff;
        border-radius: 30px;
        font-family: monospace;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 20px #ff0055;
      }
    </style>
  </head>
  <body>

    <button id="vr-btn-overlay" onclick="document.querySelector('a-scene').enterVR()">ВОЙТИ В VR (QUEST 3)</button>

    <script>
      let score = 0;
      let speed = 0.6;
      let enemies = [];

      // Компонент управления полетом через контроллер Quest 3
      AFRAME.registerComponent('quest-flight-system', {
        init: function () {
          this.player = document.querySelector('#space-jet');
          this.rightController = document.querySelector('#right-hand');
          this.scoreText = document.querySelector('#score-display');
          
          // Логика стрельбы с курка контроллера Quest
          this.rightController.addEventListener('triggerdown', () => { this.fireLasers(); });
          // Стрельба для теста на ПК (клик мыши)
          window.addEventListener('click', () => { if(!this.el.sceneEl.is('vr-mode')) this.fireLasers(); });

          // Спавним нормальных врагов подальше
          for (let i = 0; i < 6; i++) { this.createEnemy(i); }
        },

        tick: function () {
          // 1. Постоянное движение истребителя вперед в 3D пространстве
          let currentPos = this.player.getAttribute('position');
          currentPos.z -= speed;
          this.player.setAttribute('position', currentPos);

          // 2. Считываем наклон правого контроллера Quest (Джойстика)
          let ctrlRotation = this.rightController.getAttribute('rotation');
          let currentRot = this.player.getAttribute('rotation');

          if (this.el.sceneEl.is('vr-mode') && ctrlRotation) {
            // МЕТА КВЕСТ 3 УПРАВЛЕНИЕ:
            // Наклон контроллера по X (вверх/вниз) управляет тангажом самолета
            currentRot.x += (ctrlRotation.x * 0.02);
            // Наклон контроллера по Z (влево/вправо) делает крен и поворот
            currentRot.y -= (ctrlRotation.z * 0.02);
            currentRot.z = -ctrlRotation.z * 1.5; // Визуальный занос крыла
            
            // Ограничители, чтобы самолет не сделал мертвую петлю случайно
            currentRot.x = Math.max(-45, Math.min(45, currentRot.x));
            this.player.setAttribute('rotation', currentRot);
          } else {
            // Запасной режим для ПК (управление от мышки/камеры)
            let camRot = document.querySelector('#cam-eyes').getAttribute('rotation');
            this.player.setAttribute('rotation', {x: camRot.x, y: camRot.y, z: -camRot.y * 2});
          }

          // 3. Логика цикличного полета врагов
          enemies.forEach(enemy => {
            let ePos = enemy.getAttribute('position');
            // Если игрок пролетел мимо врага, перекидываем врага снова вперед
            if (ePos.z > currentPos.z + 20) {
              ePos.z = currentPos.z - 150 - (Math.random() * 50);
              ePos.x = currentPos.x + (Math.random() * 100) - 50;
              ePos.y = currentPos.y + (Math.random() * 40) - 10;
              enemy.setAttribute('position', ePos);
              enemy.setAttribute('visible', true);
              enemy.classList.add('enemy-target');
            }
          });
        },

        fireLasers: function () {
          let pPos = this.player.getAttribute('position');
          let pRot = this.player.getAttribute('rotation');

          // Функция генерации вспышек лазера из пушек
          const spawnLaserBeam = (sideOffset) => {
            let laser = document.createElement('a-box');
            laser.setAttribute('width', 0.08);
            laser.setAttribute('height', 0.08);
            laser.setAttribute('depth', 8);
            laser.setAttribute('material', {color: '#00ffff', shader: 'flat', emissive: '#00ffff'});
            
            // Позиция пушки на крыле
            laser.setAttribute('position', {x: pPos.x + sideOffset, y: pPos.y - 0.3, z: pPos.z - 3});
            laser.setAttribute('rotation', {x: pRot.x, y: pRot.y, z: 0});
            
            // Летит вперед по траектории истребителя
            laser.setAttribute('animation', {
              property: 'position',
              to: `${pPos.x + (sideOffset * 5)} ${pPos.y + (pRot.x * 0.5)} ${pPos.z - 200}`,
              dur: 350,
              easing: 'linear'
            });

            document.querySelector('a-scene').appendChild(laser);
            setTimeout(() => { laser.remove(); }, 350);
          };

          spawnLaserBeam(-2); // Левая пушка
          spawnLaserBeam(2);  // Правая пушка

          // Проверка попадания (Raycast по вектору направления самолета)
          let raycaster = document.querySelector('#hud-reticle').components.raycaster;
          let hit = raycaster.getIntersection(document.querySelectorAll('.enemy-target'));
          
          if (hit) {
            let sbiytiyDrone = hit.el;
            sbiytiyDrone.setAttribute('visible', false);
            sbiytiyDrone.classList.remove('enemy-target');
            
            score += 100;
            this.scoreText.setAttribute('value', `SCORE: ${score}`);
          }
        },

        createEnemy: function (i) {
          // Собираем полноценный вражеский корабль из базовых геометрических фигур (он не зависнет)
          let enemyContainer = document.createElement('a-entity');
          
          // Фюзеляж врага
          let body = document.createElement('a-cone');
          body.setAttribute('radius-bottom', 1);
          body.setAttribute('height', 4);
          body.setAttribute('rotation', {x: 90, y: 0, z: 0});
          body.setAttribute('material', {color: '#ff0055', metalness: 0.7, roughness: 0.3});
          enemyContainer.appendChild(body);

          // Крылья врага
          let wings = document.createElement('a-box');
          wings.setAttribute('width', 5);
          wings.setAttribute('height', 0.1);
          wings.setAttribute('depth', 1);
          wings.setAttribute('material', {color: '#aa0033'});
          enemyContainer.appendChild(wings);

          let pPos = this.player.getAttribute('position') || {x:0, y:20, z:0};
          enemyContainer.setAttribute('position', {
            x: (Math.random() * 80) - 40,
            y: (Math.random() * 30) + 5,
            z: pPos.z - (80 + (i * 30))
          });

          enemyContainer.classList.add('enemy-target');
          document.querySelector('a-scene').appendChild(enemyContainer);
          enemies.push(enemyContainer);
        }
      });
    </script>

    <a-scene quest-flight-system vr-mode-ui="enabled: true; enterVRBtn: #vr-btn-overlay" webxr="referenceSpaceType: local; requiredFeatures: local-floor">
      
      <a-sky color="#03020a"></a-sky>
      
      <a-text value="* .  * .  .  * .  * .  *" position="-20 40 -50" color="#fff" scale="5 5 5"></a-text>
      <a-text value=".  * .  * .  * .  .  * ." position="20 20 -80" color="#fff" scale="5 5 5"></a-text>

      <a-entity environment="preset: moonlight; groundColor: #090514; gridColor: #ff0055; grid: cross; dressingAmount: 0; lighting: point"></a-entity>
      <a-grid width="5000" height="5000" position="0 0 0" material="color: #070212; gridColor: #00ffcc; opacity: 0.8"></a-grid>

      <a-entity id="space-jet" position="0 25 0">
        
        <a-camera id="cam-eyes" look-controls wasd-controls-enabled="false" near="0.05">
          
          <a-entity id="cockpit-glass" geometry="primitive: sphere; radius: 2; phiLength: 180" material="color: #00ffcc; opacity: 0.08; transparent: true; wireframe: true" position="0 0.2 0" rotation="0 90 0"></a-entity>
          
          <a-box position="0 -0.5 -0.5" width="1.2" height="0.4" depth="0.4" color="#0a0a10">
            <a-circle position="0 0.11 0.21" radius="0.12" color="#00ffcc" material="opacity: 0.3; shader: flat"></a-circle>
          </a-box>

          <a-entity position="0 0 -1">
            <a-entity id="hud-reticle" raycaster="objects: .enemy-target; far: 200">
              <a-ring radius-inner="0.04" radius-outer="0.045" color="#00ffcc" material="shader: flat"></a-ring>
              <a-circle radius="0.003" color="#00ffcc" material="shader: flat"></a-circle>
            </a-entity>

            <a-text value="ALT: 2500m\nMACH: 2.1" position="0.15 -0.2 0" color="#00ffcc" width="1"></a-text>
            <a-text id="score-display" value="SCORE: 0" position="-0.35 0.3 0" color="#00ffcc" width="1.2"></a-text>
          </a-entity>

        </a-camera>

        <a-box position="-2.2 -0.3 -0.5" width="2.5" height="0.04" depth="1.2" color="#0e0f14" rotation="0 -15 5"></a-box>
        <a-box position="2.2 -0.3 -0.5" width="2.5" height="0.04" depth="1.2" color="#0e0f14" rotation="0 15 -5"></a-box>

      </a-entity>

      <a-entity id="right-hand" oculus-touch-controls="hand: right"></a-entity>
      <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>

    </a-scene>

  </body>
</html>
