<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Air Defense Simulator 2026</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      #vr-start-btn {
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
        z-index: 9999; padding: 15px 35px; background: #1b4332; color: #fff;
        border: 3px solid #52b788; border-radius: 10px; font-family: monospace;
        font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 0 25px #52b788;
      }
    </style>
  </head>
  <body>

    <button id="vr-start-btn" onclick="document.querySelector('a-scene').enterVR()">НАЧАТЬ МИССИЮ (QUEST 3)</button>

    <script>
      // Игровые параметры
      let speed = 0; // Начинаем с нуля (стоим на полосе)
      let maxSpeed = 1.2;
      let isAirborne = false; // Статус: в воздухе или на земле
      let score = 0;
      let shaheds = [];
      
      // Переменные для физического штурвала
      let isGripJoystick = false;
      let joystickVolRot = {x: 0, z: 0};

      AFRAME.registerComponent('interceptor-core', {
        init: function () {
          this.player = document.querySelector('#interceptor');
          this.rHand = document.querySelector('#right-controller');
          this.lHand = document.querySelector('#left-controller');
          this.joystick = document.querySelector('#physical-joystick');
          this.throttle = document.querySelector('#physical-throttle');
          this.scoreText = document.querySelector('#hud-score');
          this.speedText = document.querySelector('#hud-speed');
          this.altText = document.querySelector('#hud-alt');

          // События для ПРАВОЙ руки (Захват штурвала)
          this.rHand.addEventListener('gripdown', () => { isGripJoystick = true; });
          this.rHand.addEventListener('gripup', () => { isGripJoystick = false; resetJoystick(); });
          this.rHand.addEventListener('triggerdown', () => { this.fireGuns(); });

          // События для ЛЕВОЙ руки (Рычаг газа)
          this.lHand.addEventListener('triggerdown', () => { this.increaseThrottle(); });

          // Тест на ПК
          window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') this.increaseThrottle();
          });

          // Генерация целей (Шахеды) в небе
          for (let i = 0; i < 5; i++) { this.spawnShahed(i); }
        },

        increaseThrottle: function () {
          if (speed < maxSpeed) {
            speed += 0.15;
            // Двигаем рычаг газа вперед визуально
            this.throttle.setAttribute('position', ' -0.4 -0.38 -0.45');
          }
        },

        tick: function (time, timeDelta) {
          let currentPos = this.player.getAttribute('position');
          let currentRot = this.player.getAttribute('rotation');

          // Управление через СЦЕПЛЕНИЕ со штурвалом в VR
          if (isGripJoystick) {
            let handRot = this.rHand.getAttribute('rotation');
            if (handRot) {
              // Рассчитываем отклонение кисти
              let pitchAngle = handRot.x; // Наклон вперед/назад
              let rollAngle = handRot.z;  // Наклон влево/вправо

              // Передаем анимацию на сам рычаг в кабине
              this.joystick.setAttribute('rotation', {x: pitchAngle, y: 0, z: rollAngle});

              // Если набрали скорость взлета (больше 0.4) — можно отрываться от полосы
              if (speed > 0.4 || isAirborne) {
                currentRot.x += (pitchAngle * 0.015); // Тангаж
                currentRot.y -= (rollAngle * 0.015);  // Поворот
                currentRot.z = -rollAngle * 1.2;       // Крен крыльев
                
                if (currentRot.x > 2 && !isAirborne) { isAirborne = true; } // Оторвались!
              }
            }
          } else {
            // Если штурвал брошен, самолет плавно выравнивает крен
            currentRot.z *= 0.95;
            this.joystick.setAttribute('rotation', '0 0 0');
          }

          // Физика движения (вперед по вектору направления)
          if (isAirborne) {
            // Полет в 3D
            let angleY = currentRot.y * Math.PI / 180;
            let angleX = currentRot.x * Math.PI / 180;
            currentPos.x -= speed * Math.sin(angleY) * (timeDelta / 16.6);
            currentPos.z -= speed * Math.cos(angleY) * (timeDelta / 16.6);
            currentPos.y += speed * Math.sin(angleX) * (timeDelta / 16.6);
          } else {
            // Движение строго по полосе (разгон)
            currentPos.z -= speed * (timeDelta / 16.6);
            currentPos.y = 20; // Жестко на полосе
            currentRot.x = 0;
          }

          // Граница земли (чтобы не разбиться сквозь текстуры)
          if (currentPos.y < 20) { currentPos.y = 20; currentRot.x = 0; isAirborne = false; }

          this.player.setAttribute('position', currentPos);
          this.player.setAttribute('rotation', currentRot);

          // Обновление приборов на HUD
          this.speedText.setAttribute('value', `SPD: ${Math.round(speed * 600)} KM/H`);
          this.altText.setAttribute('value', `ALT: ${Math.round(currentPos.y - 20)} M`);

          // Движение Шахедов (летят по своей траектории)
          shaheds.forEach(shahed => {
            let sPos = shahed.getAttribute('position');
            sPos.z += 0.2; // Летят навстречу перехвату
            shahed.setAttribute('position', sPos);

            if (sPos.z > currentPos.z + 50) { // Если пролетел мимо, респавним впереди
              sPos.z = currentPos.z - 200;
              sPos.x = currentPos.x + (Math.random() * 200) - 100;
              shahed.setAttribute('position', sPos);
              shahed.setAttribute('visible', true);
              shahed.classList.add('shahed-target');
            }
          });
        },

        fireGuns: function () {
          let pPos = this.player.getAttribute('position');
          let pRot = this.player.getAttribute('rotation');

          const makeTracer = (offset) => {
            let tracer = document.createElement('a-sphere');
            tracer.setAttribute('radius', 0.08);
            tracer.setAttribute('material', {color: '#ffaa00', shader: 'flat'});
            tracer.setAttribute('position', {x: pPos.x + offset, y: pPos.y - 0.2, z: pPos.z - 4});
            
            let angleY = pRot.y * Math.PI / 180;
            let targetZ = pPos.z - 300;
            let targetX = pPos.x - 300 * Math.sin(angleY);

            tracer.setAttribute('animation', {
              property: 'position', to: `${targetX} ${pPos.y + (pRot.x * 3)} ${targetZ}`, dur: 400, easing: 'linear'
            });
            document.querySelector('a-scene').appendChild(tracer);
            setTimeout(() => { tracer.remove(); }, 400);
          };

          makeTracer(-1); makeTracer(1); // Огонь из пушек на крыльях

          // Проверка попадания
          let ray = document.querySelector('#hud-pointer').components.raycaster;
          let hit = ray.getIntersection(document.querySelectorAll('.shahed-target'));
          if (hit) {
            let target = hit.el;
            target.setAttribute('visible', false);
            target.classList.remove('shahed-target');
            score += 1;
            this.scoreText.setAttribute('value', `SHAHEDS DOWN: ${score}`);
          }
        },

        spawnShahed: function (i) {
          // Создаем узнаваемую модель Шахеда (большое треугольное крыло Delta-wing)
          let shahed = document.createElement('a-entity');
          
          // Главное дельтовидное крыло (треугольник)
          let wing = document.createElement('a-cone');
          wing.setAttribute('radius-bottom', 3);
          wing.setAttribute('height', 0.2);
          wing.setAttribute('scale', '1 1 0.4'); // Делаем плоским
          wing.setAttribute('rotation', '90 0 0');
          wing.setAttribute('material', 'color: #2b2b2b; metalness: 0.5');
          shahed.appendChild(wing);

          // Фюзеляж (центральный фюзеляж-капсула)
          let fus = document.createElement('a-cylinder');
          fus.setAttribute('radius', 0.2); fus.setAttribute('height', 2.5);
          fus.setAttribute('rotation', '90 0 0');
          fus.setAttribute('material', 'color: #1a1a1a');
          shahed.appendChild(fus);

          // Позиция спавна далеко впереди в небе
          shahed.setAttribute('position', {
            x: (Math.random() * 150) - 75,
            y: (Math.random() * 40) + 40,
            z: -150 - (i * 40)
          });

          shahed.classList.add('shahed-target');
          document.querySelector('a-scene').appendChild(shahed);
          shaheds.push(shahed);
        }
      });

      function resetJoystick() {
        document.querySelector('#physical-joystick').setAttribute('rotation', '0 0 0');
      }
    </script>

    <a-scene interceptor-core vr-mode-ui="enabled: true; enterVRBtn: #vr-start-btn" webxr="referenceSpaceType: local">
      
      <a-sky color="#050814"></a-sky>
      <a-light type="ambient" color="#888"></a-light>
      <a-light type="directional" color="#fff" position="-1 2 1"></a-light>

      <a-grid width="10000" height="10000" material="color: #1b4332; gridColor: #2d6a4f; opacity: 0.9" rotation="-90 0 0"></a-grid>

      <a-box position="0 19.9 -200" width="16" height="0.1" depth="800" color="#3d3d3d"></a-box>
      <a-box position="0 19.95 -100" width="0.4" height="0.05" depth="20" color="#ffffff"></a-box>
      <a-box position="0 19.95 -200" width="0.4" height="0.05" depth="20" color="#ffffff"></a-box>
      <a-box position="0 19.95 -300" width="0.4" height="0.05" depth="20" color="#ffffff"></a-box>
      <a-sphere position="-8 20 -50" radius="0.2" color="#ff0000" material="shader:flat"></a-sphere>
      <a-sphere position="8 20 -50" radius="0.2" color="#00ff00" material="shader:flat"></a-sphere>
      <a-sphere position="-8 20 -150" radius="0.2" color="#ff0000" material="shader:flat"></a-sphere>
      <a-sphere position="8 20 -150" radius="0.2" color="#00ff00" material="shader:flat"></a-sphere>
      <a-sphere position="-8 20 -250" radius="0.2" color="#ff0000" material="shader:flat"></a-sphere>
      <a-sphere position="8 20 -250" radius="0.2" color="#00ff00" material="shader:flat"></a-sphere>

      <a-entity id="interceptor" position="0 20 0" rotation="0 0 0">
        
        <a-camera id="cam-eyes" look-controls wasd-controls-enabled="false" near="0.05">
          
          <a-entity position="0 0 -0.8">
            <a-entity id="hud-pointer" raycaster="objects: .shahed-target; far: 400">
              <a-ring radius-inner="0.03" radius-outer="0.033" color="#39ff14" material="shader: flat"></a-ring>
              <a-circle radius="0.002" color="#39ff14" material="shader: flat"></a-circle>
            </a-entity>
            
            <a-text id="hud-speed" value="SPD: 0 KM/H" position="0.12 0.15 0" color="#39ff14" width="0.8" font="monoid"></a-text>
            <a-text id="hud-alt" value="ALT: 0 M" position="0.12 0.08 0" color="#39ff14" width="0.8" font="monoid"></a-text>
            <a-text id="hud-score" value="SHAHEDS DOWN: 0" position="-0.25 0.22 0" color="#39ff14" width="0.8" font="monoid"></a-text>
            <a-text value="READY TO TAKEOFF\nHOLD GRIP TO TAKE STICK" position="-0.25 -0.2 0" color="#39ff14" width="0.6" font="monoid"></a-text>
          </a-entity>

          <a-cylinder position="0 0.1 -0.4" radius="1.1" height="1.2" rotation="90 0 0" material="color: #2b2d42; opacity: 0.15; transparent: true; wireframe: true"></a-cylinder>
          <a-box position="0 -0.5 -0.4" width="1" height="0.3" depth="0.4" color="#1c1d22"></a-box>

          <a-entity id="physical-joystick" position="0 -0.38 -0.35">
            <a-cylinder radius="0.015" height="0.25" color="#333"></a-cylinder>
            <a-sphere radius="0.035" color="#780000" position="0 0.12 0"></a-sphere>
          </a-entity>

          <a-box id="physical-throttle" position="-0.4 -0.38 -0.5" width="0.04" height="0.08" depth="0.15" color="#4a4e69">
            <a-cylinder radius="0.01" height="0.1" color="#ff4d6d" rotation="90 0 90" position="0 0.05 0"></a-cylinder>
          </a-box>

        </a-camera>

        <a-box position="-2.5 -0.2 -1" width="3" height="0.05" depth="1.5" color="#2b2d42"></a-box>
        <a-box position="2.5 -0.2 -1" width="3" height="0.05" depth="1.5" color="#2b2d42"></a-box>

      </a-entity>

      <a-entity id="right-controller" oculus-touch-controls="hand: right"></a-entity>
      <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>

    </a-scene>
  </body>
</html>
