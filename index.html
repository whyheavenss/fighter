<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Quest 3: Shahed Hunter VR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #vr-button {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: #ff0055; color: white; border: 2px solid white;
            border-radius: 8px; font-family: monospace; font-size: 18px; cursor: pointer; z-index: 999;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="vr-button">ВОЙТИ В VR (QUEST 3)</button>

    <script>
        let scene, camera, renderer;
        let jet, runway, joystick;
        let speed = 0, isAirborne = false;
        let shaheds = [], bullets = [];
        let score = 0;
        let controllerRight;

        // Настройка 3D Сцены
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208); // Темное ночное небо

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Рендеринг с поддержкой WebXR (для шлемов)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Кнопка входа в VR
            const vrBtn = document.getElementById('vr-button');
            vrBtn.addEventListener('click', () => {
                navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then((session) => {
                    renderer.xr.setSession(session);
                    vrBtn.style.display = 'none';
                });
            });

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Земля (Зеленое поле)
            const groundGeo = new THREE.PlaneGeometry(5000, 5000, 10, 10);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x113311, wireframe: true });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // ВЗЛЕТНАЯ ПОЛОСА (Серая бетонка)
            const runwayGeo = new THREE.BoxGeometry(20, 0.1, 600);
            const runwayMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            runway = new THREE.Mesh(runwayGeo, runwayMat);
            runway.position.set(0, 0.05, -250);
            scene.add(runway);

            // ИСТРЕБИТЕЛЬ И КАБИНА
            jet = new THREE.Group();
            jet.position.set(0, 0, 0); // Старт на полосе
            scene.add(jet);

            // Кабина (прозрачный купол вокруг камеры)
            const glassGeo = new THREE.SphereGeometry(2, 16, 16);
            const glassMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, opacity: 0.03, transparent: true });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            jet.add(glass);

            // Штурвал / Рычаг в кабине
            const stickGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4);
            const stickMat = new THREE.MeshLambertMaterial({ color: 0xff0055 });
            joystick = new THREE.Mesh(stickGeo, stickMat);
            joystick.position.set(0, -0.3, -0.5);
            jet.add(joystick);

            // Привязываем камеру к самолету
            jet.add(camera);
            camera.position.set(0, 0.5, 0); // Глаза пилота чуть выше центра

            // ПОДКЛЮЧАЕМ ОТСЛЕЖИВАНИЕ КОНТРОЛЛЕРА QUEST 3
            controllerRight = renderer.xr.getController(0); // Правая рука
            controllerRight.addEventListener('triggerdown', fireGuns); // Стрельба на курок
            scene.add(controllerRight);

            // Создаем Шахеды в небе
            for (let i = 0; i < 5; i++) { spawnShahed(); }

            renderer.setAnimationLoop(gameLoop);
        }

        // Спавн Шахеда (Треугольное крыло)
        function spawnShahed() {
            const shahedGroup = new THREE.Group();
            
            // Крыло дельта
            const wingGeo = new THREE.ConeGeometry(3, 0.2, 3);
            const wingMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const wing = new THREE.Mesh(wingGeo, wingMat);
            wing.rotation.x = Math.PI / 2;
            shahedGroup.add(wing);

            // Фюзеляж
            const bodyGeo = new THREE.CylinderGeometry(0.2, 0.2, 2);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            shahedGroup.add(body);

            // Позиция впереди в небе
            shahedGroup.position.set((Math.random() * 200) - 100, (Math.random() * 50) + 20, jet.position.z - 400 - (Math.random() * 200));
            scene.add(shahedGroup);
            shaheds.push(shahedGroup);
        }

        // Стрельба лазером
        function fireGuns() {
            const bulletGeo = new THREE.CylinderGeometry(0.05, 0.05, 4);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            
            const b1 = new THREE.Mesh(bulletGeo, bulletMat);
            b1.rotation.x = Math.PI / 2;
            b1.position.set(jet.position.x - 1, jet.position.y, jet.position.z - 2);
            
            scene.add(b1);
            bullets.push(b1);
        }

        // Главный цикл игры
        function gameLoop() {
            // 1. Набор скорости для взлета
            if (speed < 0.8) speed += 0.005;

            // 2. ОТСЛЕЖИВАНИЕ НАКЛОНА РУКИ С КОНТРОЛЛЕРОМ
            if (controllerRight) {
                // Берем поворот контроллера из реального мира
                let handRot = controllerRight.rotation;

                // Передаем наклон виртуальному штурвалу в кабине
                joystick.rotation.set(handRot.x, 0, handRot.z);

                // Физика полета от наклона твоей руки:
                // Если потянул руку на себя (handRot.x > 0) и скорость большая — взлетаем
                if (speed > 0.3) {
                    jet.rotation.y -= handRot.z * 0.02; // Поворот влево/вправо
                    
                    // Если штурвал потянули на себя — задираем нос
                    if (handRot.x < -0.1 || isAirborne) {
                        jet.rotation.x = -handRot.x * 0.5;
                        isAirborne = true;
                    }
                }
            }

            // Движение самолета вперед по вектору наклона
            if (isAirborne) {
                jet.translateZ(-speed);
            } else {
                // Разгон по взлетной полосе
                jet.position.z -= speed;
                jet.position.y = 0;
                jet.rotation.x = 0;
            }

            // Земля не дает упасть ниже полосы
            if (jet.position.y < 0) { jet.position.y = 0; isAirborne = false; }

            // Движение пуль
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].position.z -= 4;
                
                // Проверка попадания в Шахеды
                for (let j = shaheds.length - 1; j >= 0; j--) {
                    let dist = bullets[i].position.distanceTo(shaheds[j].position);
                    if (dist < 15) {
                        // Попал! Взрываем Шахед
                        scene.remove(shaheds[j]);
                        shaheds.splice(j, 1);
                        scene.remove(bullets[i]);
                        bullets.splice(i, 1);
                        score++;
                        spawnShahed(); // Спавним нового вместо сбитого
                        break;
                    }
                }
                
                // Удаляем старые пули
                if (bullets[i] && bullets[i].position.z < jet.position.z - 500) {
                    scene.remove(bullets[i]);
                    bullets.splice(i, 1);
                }
            }

            // Движение Шахедов навстречу
            shaheds.forEach(shahed => {
                shahed.position.z += 0.5; // Летят на нас
                if (shahed.position.z > jet.position.z + 50) {
                    // Если пролетел мимо — перекидываем вперед
                    shahed.position.set((Math.random() * 200) - 100, (Math.random() * 50) + 20, jet.position.z - 500);
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
