<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebXR Interceptor: No Chaos, Total Defense</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      /* Кнопка на ПК, чтобы развернуть */
      #fallback-btn {
        position: absolute; top: 10px; left: 10px; z-index: 1000;
        padding: 10px; background: #FF3366; color: #fff; border: none;
      }
    </style>
  </head>
  <body>

    <button id="fallback-btn" onclick="document.querySelector('a-scene').enterVR()">ВОЙТИ В VR (QUEST 3)</button>

    <script>
      // Игровые переменные
      let speed = 0; // Разгон с нуля
      let isAirborne = false; 
      let score = 0;
      let shaheds = [];
      let maxSpeed = 1.0; // Быстрый разгон

      AFRAME.registerComponent('fighter-systems', {
        init: function () {
          this.player = document.querySelector('#fighter');
          this.camera = document.querySelector('#eyes');
          this.rCtrl = document.querySelector('#right-quest-controller');
          this.scoreTxt = document.querySelector('#score-txt');
          this.speedTxt = document.querySelector('#spd-txt');
          this.altTxt = document.querySelector('#alt-txt');
          this.joystick = document.querySelector('#rus');
          
          // Слушаем КУРОК (Trigger) на Quest 3 для стрельбы
          this.rCtrl.addEventListener('triggerdown', () => { this.fireCanons(); });
          
          // Тест стрельбы на ПК
          window.addEventListener('click', () => { if(!this.el.sceneEl.is('vr-mode')) this.fireCanons(); });

          // Создаем Шахеды внутри кода
          for (let i = 0; i < 5; i++) { this.createShahed(i); }
        },

        tick: function (time, timeDelta) {
          if (speed < maxSpeed) { speed += 0.015; } // Авто-разгон

          let pos = this.player.getAttribute('position');
          let rot = this.player.getAttribute('rotation');

          // 🎮 VR Управление через наклон контроллера Quest 3
          // Мы считываем положение и передаем его наклон
          let ctrlRot = this.rCtrl.getAttribute('rotation');
          if (ctrlRot) {
            rot.x += (ctrlRot.x * 0.012); // Тангаж (вверх/вниз)
            rot.y -= (ctrlRot.z * 0.012); // Поворот
            rot.z = -ctrlRot.z * 1.5;      // Визуальный крен

            // Ограничители, чтобы не закрутило
            rot.x = Math.max(-40, Math.min(40, rot.x));
            
            // Анимируем джойстик в кабине за истребителем
            this.joystick.setAttribute('rotation', { x: -rot.x, y: 0, z: -rot.z });
            
            // Взлет: если набрали скорость взлета (больше 0.35)
            if (speed > 0.35 && rot.x > 2 && !isAirborne) { isAirborne = true; }
          }

          // Физика движения
          if (isAirborne) {
            // Полет в 3D пространстве
            let angleY = rot.y * Math.PI / 180;
            let angleX = rot.x * Math.PI / 180;
            pos.x -= speed * Math.sin(angleY) * (timeDelta / 16.6);
            pos.z -= speed * Math.cos(angleY) * (timeDelta / 16.6);
            pos.y += speed * Math.sin(angleX) * (timeDelta / 16.6);
          } else {
            // Разгон строго по полосе
            pos.z -= speed * (timeDelta / 16.6);
            pos.y = 20; 
          }

          // Граница земли
          if (pos.y < 20) { pos.y = 20; rot.x = 0; isAirborne = false; }
          
          this.player.setAttribute('position', pos);
          this.player.setAttribute('rotation', rot);

          // Обновление HUD приборов
          this.speedText.setAttribute('value', `SPD: ${Math.round(speed * 1200)} KTS`);
          this.altText.setAttribute('value', `ALT: ${Math.round(pos.y - 20)} M`);

          // Движение Шахедов
          shaheds.forEach(drone => {
            let dPos = drone.getAttribute('position');
            dPos.z += speed * 0.9 * (timeDelta / 16.6);
            drone.setAttribute('position', dPos);

            if (dPos.z > pos.z + 50) { // Респавн впереди
              dPos.z = pos.z - 150;
              dPos.x = pos.x + (Math.random() * 200) - 100;
              dPos.y = pos.y + (Math.random() * 40) + 10;
              drone.setAttribute('position', dPos);
              drone.setAttribute('visible', true);
              drone.classList.add('can-shoot');
            }
          });
        },

        fireCanons: function () {
          let pPos = this.player.getAttribute('position');
          let pRot = this.player.getAttribute('rotation');

          const spawnTracer = (offset) => {
            let tracer = document.createElement('a-cylinder');
            tracer.setAttribute('radius', 0.06); tracer.setAttribute('height', 8);
            tracer.setAttribute('material', {color: '#ffff33', shader: 'flat', emissive: '#ffff00'});
            tracer.setAttribute('position', {x: pPos.x + offset, y: pPos.y, z: pPos.z - 3});
            
            let targetZ = pPos.z - 300;
            let targetX = pPos.x - 300 * Math.sin(pRot.y * Math.PI / 180);

            tracer.setAttribute('animation', {
              property: 'position', to: `${targetX} ${pPos.y + (pRot.x * 2)} ${targetZ}`, dur: 450, easing: 'linear'
            });
            document.querySelector('a-scene').appendChild(tracer);
            setTimeout(() => { tracer.remove(); }, 450);
          };

          spawnTracer(-1.5); spawnTracer(1.5); // Стрельба с двух крыльев

          // Raycast прицела
          let pointerRay = document.querySelector('#hud-pointer').components.raycaster;
          let intersections = pointerRay.getIntersection(document.querySelectorAll('.can-shoot'));
          if (intersections) {
            let hitDrone = intersections.el;
            hitDrone.setAttribute('visible', false);
            hitDrone.classList.remove('can-shoot');
            score += 100;
            this.scoreTxt.setAttribute('value', score);
          }
        },

        createShahed: function (i) {
          // Создаем Шахед 136 (треугольный корпус + фюзеляж) внутри кода
          let container = document.createElement('a-entity');
          
          // Большое треугольное крыло (Delta-wing)
          let deltaWing = document.createElement('a-cone');
          deltaWing.setAttribute('radius-bottom', 2.5); deltaWing.setAttribute('height', 0.1);
          deltaWing.setAttribute('scale', '1 1 0.3'); // Тонкое
          deltaWing.setAttribute('rotation', '90 0 0');
          deltaWing.setAttribute('material', {color: '#2a2a2a', metalness: 0.6, roughness: 0.3});
          container.appendChild(deltaWing);

          // Центральный фюзеляж (капсула)
          let fuselage = document.createElement('a-cylinder');
          fuselage.setAttribute('radius', 0.15); fuselage.setAttribute('height', 2.2);
          fuselage.setAttribute('rotation', '90 0 0');
          fuselage.setAttribute('material', {color: '#1a1a1a'});
          container.appendChild(fuselage);

          let pPos = this.player.getAttribute('position') || {x:0, y:20, z:0};
          container.setAttribute('position', {
            x: (Math.random() * 80) - 40,
            y: (Math.random() * 40) + 10,
            z: pPos.z - (100 + (i * 30))
          });

          container.classList.add('can-shoot');
          document.querySelector('a-scene').appendChild(container);
          shaheds.push(container);
        }
      });
    </script>

    <a-scene fighter-systems vr-mode-ui="enabled: true; enterVRBtn: #fallback-btn" webxr="referenceSpaceType: local">
      
      <a-sky color="#03081a"></a-sky> <a-light type="ambient" color="#BBB"></a-light>
      <a-light type="directional" color="#FFF; intensity: 0.9" position="-1 2 1"></a-light>

      <a-grid width="5000" height="5000" material="color: #0b0f2a; gridColor: #33ffff; opacity: 0.8" rotation="-90 0 0"></a-grid>

      <a-box position="0 19.95 -150" width="16" height="0.1" depth="500" color="#3d3d4a"></a-box>
      <a-box position="0 19.98 -100" width="0.4" height="0.05" depth="20" color="#ffffff"></a-box>
      <a-box position="0 19.98 -200" width="0.4" height="0.05" depth="20" color="#ffffff"></a-box>
      <a-box position="0 19.98 -300" width="0.4" height="0.05" depth="20" color="#ffffff"></a-box>

      <a-entity id="fighter" position="0 20 0">
        
        <a-camera id="eyes" look-controls wasd-controls-enabled="false" near="0.05">
          
          <a-entity position="0 0 -1">
            <a-entity id="hud-pointer" raycaster="objects: .can-shoot; far: 250">
              <a-ring radius-inner="0.04" radius-outer="0.045" color="#33ff33" material="shader: flat; opacity:0.8; transparent:true"></a-ring>
              <a-circle radius="0.003" color="#33ff33" material="shader: flat"></a-circle>
            </a-entity>
            
            <a-text id="spd-txt" value="SPD: 0 KTS" position="0.2 0.22 0" color="#33ff33" width="1"></a-text>
            <a-text id="alt-txt" value="ALT: 0 M" position="0.2 0.15 0" color="#33ff33" width="1"></a-text>
            <a-text value="TARGETS DOWN:" position="-0.4 0.35 0" color="#33ff33" width="1.2"></a-text>
            <a-text id="score-txt" value="0" position="-0.15 0.35 0" color="#33ff33" width="1.5"></a-text>
          </a-entity>

          <a-sphere radius="2.2" phiLength="180" material="color: #66ccff; opacity: 0.1; transparent: true; wireframe: false" rotation="0 90 0"></a-sphere>
          <a-box position="0 -0.8 -0.6" width="1.2" height="0.6" depth="0.5" color="#1a1c22"></a-box>

          <a-entity id="rus" position="0 -0.42 -0.45">
            <a-cylinder radius="0.015" height="0.25" color="#111"></a-cylinder>
            <a-sphere radius="0.035" color="#cc0000" position="0 0.13 0"></a-sphere>
          </a-entity>

        </a-camera>

        <a-box position="-3.5 -0.3 -2" width="4" height="0.04" depth="2" color="#0a0f2a" rotation="0 -15 10"></a-box>
        <a-box position="3.5 -0.3 -2" width="4" height="0.04" depth="2" color="#0a0f2a" rotation="0 15 -10"></a-box>
        
      </a-entity>

      <a-entity id="right-quest-controller" oculus-touch-controls="hand: right"></a-entity>
      <a-entity oculus-touch-controls="hand: left"></a-entity>

    </a-scene>
  </body>
</html>
