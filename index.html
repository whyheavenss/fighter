<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quest 3: Настоящий Перехватчик ПВО</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020208; }
        #start-vr-inside-quest {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 25px 50px; background: #00ff66; color: black; border: 4px solid white;
            border-radius: 15px; font-family: monospace; font-size: 24px; font-weight: bold;
            cursor: pointer; z-index: 9999; box-shadow: 0 0 40px #00ff66;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.min.js"></script>
</head>
<body>

    <button id="start-vr-inside-quest">ЗАПУСТИТЬ 3D МИССИЮ В VR</button>

    <script>
        let scene, camera, renderer;
        let jet, joystickBase, joystick;
        let speed = 0, isAirborne = false;
        let shaheds = [], bullets = [], factories = [];
        let score = 0;
        
        let controllerRight;
        let isHoldingJoystick = false;

        // Инициализация графики WebXR
        function initVR() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x110924); // Пурпурное боевое небо
            scene.fog = new THREE.FogExp2(0x110924, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // Аппаратное включение VR
            document.body.appendChild(renderer.domElement);

            // Обработка входа в VR сессию Quest 3
            const btn = document.getElementById('start-vr-inside-quest');
            navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then((session) => {
                renderer.xr.setSession(session);
                btn.style.display = 'none';
            });

            // Освещение сцены
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const sun = new THREE.DirectionalLight(0xffaa44, 1.0);
            sun.position.set(100, 300, -100);
            scene.add(sun);

            // Текстурированная земля
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(4000, 4000, 20, 20),
                new THREE.MeshLambertMaterial({ color: 0x151b13, wireframe: true })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // ИНДУСТРИАЛЬНЫЕ ЦЕЛИ ДЛЯ ШАХЕДОВ (ЗАВОДЫ И ТЭЦ)
            for (let i = 0; i < 5; i++) {
                let factory = new THREE.Group();
                
                // Здание завода
                let body = new THREE.Mesh(new THREE.BoxGeometry(30, 12, 50), new THREE.MeshLambertMaterial({color: 0x44444a}));
                body.position.y = 6;
                factory.add(body);

                // Дымовая труба ТЭЦ
                let chimney = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.5, 30), new THREE.MeshLambertMaterial({color: 0x662222}));
                chimney.position.set(10, 15, -15);
                factory.add(chimney);

                // Сигнальный огонек
                let light = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({color: 0xff0000}));
                light.position.set(10, 30, -15);
                factory.add(light);

                factory.position.set((i - 2) * 200, 0, -500 - (Math.random() * 200));
                scene.add(factory);
                factories.push(factory);
            }

            // ВЗЛЕТНАЯ ПОЛОСА ПВО
            runway = new THREE.Mesh(new THREE.BoxGeometry(25, 0.2, 800), new THREE.MeshLambertMaterial({ color: 0x222226 }));
            runway.position.set(0, 0.1, -350);
            scene.add(runway);

            // ИСТРЕБИТЕЛЬ ПИЛОТА
            jet = new THREE.Group();
            jet.position.set(0, 0, 0); // Старт в начале ВПП
            scene.add(jet);

            // Кабина (Защитное стекло)
            const glass = new THREE.Mesh(
                new THREE.SphereGeometry(2.4, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, opacity: 0.03, transparent: true })
            );
            jet.add(glass);

            // Торпедо с приборами
            const dash = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.4), new THREE.MeshLambertMaterial({color: 0x16171c}));
            dash.position.set(0, -0.4, -0.7);
            jet.add(dash);

            // 🕹 ВЫСОКИЙ ШТУРВАЛ (РУС) ПРЯМО ПЕРЕД ГРУДЬЮ ПИЛОТА
            joystickBase = new THREE.Group();
            joystickBase.position.set(0, 0.1, -0.45); // Поднят в удобную зону хвата рук
            jet.add(joystickBase);

            const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.45), new THREE.MeshLambertMaterial({ color: 0x222 }));
            stick.position.y = 0.22;
            joystickBase.add(stick);

            joystick = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshLambertMaterial({ color: 0xff0033 }));
            joystick.position.y = 0.45;
            joystickBase.add(joystick);

            // Закрепляем камеру (Твои глаза) в центре кабины
            jet.add(camera);
            camera.position.set(0, 0.6, 0);

            // Крылья самолета по бокам
            const wingL = new THREE.Mesh(new THREE.BoxGeometry(3, 0.05, 1.5), new THREE.MeshLambertMaterial({color: 0x16171c}));
            wingL.position.set(-2.4, -0.2, -0.5);
            jet.add(wingL);
            const wingR = new THREE.Mesh(new THREE.BoxGeometry(3, 0.05, 1.5), new THREE.MeshLambertMaterial({color: 0x16171c}));
            wingR.position.set(2.4, -0.2, -0.5);
            jet.add(wingR);

            // 🎮 ПОДКЛЮЧЕНИЕ ПРАВОГО КОНТРОЛЛЕРА QUEST 3
            controllerRight = renderer.xr.getController(0);
            
            // Захват штурвала на боковую кнопку GRIP
            controllerRight.addEventListener('gripdown', () => { isHoldingJoystick = true; });
            controllerRight.addEventListener('gripup', () => { isHoldingJoystick = false; joystickBase.rotation.set(0, 0, 0); });
            
            // Стрельба на передний КУРОК (TRIGGER)
            controllerRight.addEventListener('triggerdown', () => { if (isHoldingJoystick) fireCanons(); });
            
            scene.add(controllerRight);

            // Спавн Шахедов в небе
            for (let i = 0; i < 6; i++) { spawnShahed(); }

            renderer.setAnimationLoop(gameLoop);
        }

        // РЕАЛИСТИЧНАЯ МОДЕЛЬ ШАХЕДА-136 (Крыло дельта + хвостовые кили)
        function spawnShahed() {
            const shahedGroup = new THREE.Group();
            
            // Главное треугольное крыло
            const wing = new THREE.Mesh(new THREE.ConeGeometry(4, 0.15, 3), new THREE.MeshLambertMaterial({ color: 0x2d3033 }));
            wing.rotation.x = Math.PI / 2;
            shahedGroup.add(wing);

            // Центральный фюзеляж-труба
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 2.4), new THREE.MeshLambertMaterial({ color: 0x1a1c1e }));
            body.rotation.x = Math.PI / 2;
            body.position.z = -0.4;
            shahedGroup.add(body);

            // Кили на краях крыльев
            const k1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.7, 0.5), new THREE.MeshLambertMaterial({color: 0x1a1c1e}));
            k1.position.set(-2, 0.2, 0.4);
            shahedGroup.add(k1);
            const k2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.7, 0.5), new THREE.MeshLambertMaterial({color: 0x1a1c1e}));
            k2.position.set(2, 0.2, 0.4);
            shahedGroup.add(k2);

            // Наведение Шахеда на один из заводов
            let target = factories[Math.floor(Math.random() * factories.length)];
            shahedGroup.position.set(
                target.position.x + (Math.random() * 80 - 40),
                150 + Math.random() * 50,
                jet.position.z - 1000 - Math.random() * 400
            );

            shahedGroup.userData = { targetX: target.position.x, targetZ: target.position.z };
            scene.add(shahedGroup);
            shaheds.push(shahedGroup);
        }

        function fireCanons() {
            // Мощный сдвоенный плазменный залп
            const makeTracer = (side) => {
                const b = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 6), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
                b.rotation.x = Math.PI / 2;
                b.position.set(jet.position.x + side, jet.position.y - 0.2, jet.position.z - 4);
                scene.add(b);
                bullets.push(b);
            };
            makeTracer(-1.5); makeTracer(1.5);
        }

        // ОСНОВНОЙ ТАКТ ИГРЫ (90 FPS ВНУТРИ ШЛЕМA)
        function gameLoop() {
            // Автоматический разгон истребителя на бетонке
            if (speed < 1.3) speed += 0.007;

            // Логика штурвала
            if (controllerRight && isHoldingJoystick) {
                let handRot = controllerRight.rotation;
                
                // Рычаг в кабине отклоняется за твоим контроллером
                joystickBase.rotation.set(handRot.x, 0, handRot.z);

                // Управление полетом
                if (speed > 0.4) {
                    jet.rotation.y -= handRot.z * 0.015; // Поворот влево/вправо
                    jet.rotation.z = -handRot.z * 1.4;   // РЕАЛИСТИЧНЫЙ КРЕН НА КРЫЛО ПРИ ПОВОРОТЕ
                    
                    if (handRot.x < -0.05 || isAirborne) {
                        jet.rotation.x = -handRot.x * 0.45; // Взлет при наклоне руки на себя
                        isAirborne = true;
                    }
                }
            } else {
                // Штурвал брошен — самолет выравнивает крылья
                jet.rotation.z *= 0.93;
                if (isAirborne) jet.rotation.x *= 0.97;
            }

            // Физика шасси
            if (isAirborne) {
                jet.translateZ(-speed);
            } else {
                jet.position.z -= speed;
                jet.position.y = 0.1;
                jet.rotation.x = 0;
            }

            if (jet.position.y < 0.1) { jet.position.y = 0.1; isAirborne = false; }

            // Движение снарядов авиапушек
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].position.z -= 5;
                
                for (let j = shaheds.length - 1; j >= 0; j--) {
                    if (bullets[i].position.distanceTo(shaheds[j].position) < 22) {
                        scene.remove(shaheds[j]);
                        shaheds.splice(j, 1);
                        scene.remove(bullets[i]);
                        bullets.splice(i, 1);
                        score++;
                        spawnShahed(); // Спавним новую цель
                        break;
                    }
                }

                if (bullets[i] && bullets[i].position.z < jet.position.z - 600) {
                    scene.remove(bullets[i]);
                    bullets.splice(i, 1);
                }
            }

            // ШАХЕДЫ ПИКИРУЮТ НА ЗАВОДЫ
            shaheds.forEach((shahed, idx) => {
                let data = shahed.userData;
                shahed.position.z += 0.55; // Скорость камикадзе
                
                // Доворот на цель
                if (shahed.position.x < data.targetX) shahed.position.x += 0.12;
                if (shahed.position.x > data.targetX) shahed.position.x -= 0.12;

                // Фаза пикирования
                if (shahed.position.z > data.targetZ - 250 && shahed.position.y > 5) {
                    shahed.position.y -= 0.5;
                    shahed.rotation.x = 0.25; // Нос вниз к заводу
                }

                // Удар по зданию
                if (shahed.position.z >= data.targetZ && Math.abs(shahed.position.x - data.targetX) < 25) {
                    scene.remove(shahed);
                    shaheds.splice(idx, 1);
                    spawnShahed(); // Летит следующий дрон
                }
            });

            renderer.render(scene, camera);
        }

        // Триггер запуска
        document.getElementById('start-vr-inside-quest').addEventListener('click', initVR);
    </script>
</body>
</html>
